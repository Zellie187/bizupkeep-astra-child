<!--
  BizUpKeep primary horizontal lockup - dark-background variant.
  Used in the footer (Ink background). Wordmark text is recolored to
  Paper (#FFFDF8) so it reads against the dark background; "Up" stays
  Gold (#FFC93C), matching the light variant. The icon mark's own
  colors (coral/teal/violet bars, gold arrow) are unchanged from
  logo-light.svg - they already have enough contrast against Ink.

  Text is set with a Space Grotesk font-family reference for editing
  convenience. For print or any use outside a browser, open in
  Illustrator/Inkscape/Figma with Space Grotesk installed and convert
  the text to outlines before handing the file off.
-->
<svg width="320" height="70" viewBox="0 0 320 70" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BizUpKeep">
  <g transform="translate(0, 12)">
    <rect x="2" y="30" width="10" height="16" rx="3" fill="#FF5A5F"/>
    <rect x="17" y="20" width="10" height="26" rx="3" fill="#00BFA6"/>
    <rect x="32" y="8" width="10" height="38" rx="3" fill="#7B5EF5"/>
    <path d="M7 30 L22 20 L37 8 L50 2" stroke="#FFC93C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M42 2 L50 2 L50 10" stroke="#FFC93C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <text x="72" y="46" font-family="'Space Grotesk', 'Poppins', 'Arial', sans-serif" font-weight="700" font-size="34" letter-spacing="-0.3" fill="#FFFDF8">Biz<tspan fill="#FFC93C">Up</tspan>Keep</text>
</svg>
