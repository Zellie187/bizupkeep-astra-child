<!--
  BizUpKeep primary horizontal lockup - light-background variant.
  Used in the header (paper background). Wordmark text is Ink
  (#1B1A2E); "Up" is Gold (#FFC93C). See logo-dark.svg for the
  dark-background variant used in the footer.

  Text is set with a Space Grotesk font-family reference for editing
  convenience. For print or any use outside a browser (business cards,
  signage, PDF exports), open in Illustrator/Inkscape/Figma with Space
  Grotesk installed and convert the text to outlines before handing
  the file off, so it doesn't depend on the font being present on
  whatever machine opens it next.
-->
<svg width="320" height="70" viewBox="0 0 320 70" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BizUpKeep">
  <g transform="translate(0, 12)">
    <rect x="2" y="30" width="10" height="16" rx="3" fill="#FF5A5F"/>
    <rect x="17" y="20" width="10" height="26" rx="3" fill="#00BFA6"/>
    <rect x="32" y="8" width="10" height="38" rx="3" fill="#7B5EF5"/>
    <path d="M7 30 L22 20 L37 8 L50 2" stroke="#FFC93C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M42 2 L50 2 L50 10" stroke="#FFC93C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <text x="72" y="46" font-family="'Space Grotesk', 'Poppins', 'Arial', sans-serif" font-weight="700" font-size="34" letter-spacing="-0.3" fill="#1B1A2E">Biz<tspan fill="#FFC93C">Up</tspan>Keep</text>
</svg>
